# Production profile — used on Fly.io / managed hosts.
# Connection details come from environment variables; Spring Boot maps
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD automatically.
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# Disable the H2 console outside dev.
spring.h2.console.enabled=false

# CORS allowlist — comma-separated. Set APP_CORS_ALLOWED_ORIGINS to your Vercel domain.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
