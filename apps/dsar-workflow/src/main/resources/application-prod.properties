# Production profile — used on Fly.io and other managed hosts.
# Falls back to H2 in-memory when SPRING_DATASOURCE_URL is not set, so a fresh
# deployment boots with zero database setup. To use real Postgres, attach a
# managed Postgres and set SPRING_DATASOURCE_URL/USERNAME/PASSWORD (the
# entrypoint shim derives these from DATABASE_URL automatically).
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:dsar;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.h2.console.enabled=false

# CORS allowlist (comma-separated). Set APP_CORS_ALLOWED_ORIGINS to the public UI domain.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Seed demo data on startup when the table is empty. Disable by setting demo.seed.enabled=false.
demo.seed.enabled=${DEMO_SEED_ENABLED:true}
