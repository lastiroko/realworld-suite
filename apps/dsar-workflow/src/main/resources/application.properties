server.port=8080
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Default to an in-memory H2 database for local development so bootRun works without Postgres.
spring.datasource.url=jdbc:h2:mem:dsar;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# Enable the H2 console at /h2-console for quick inspection during development.
spring.h2.console.enabled=true
