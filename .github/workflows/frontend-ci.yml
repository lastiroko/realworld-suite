name: frontend-ci
on:
  push:
    paths: ["apps/ui/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["apps/ui/**", ".github/workflows/frontend-ci.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
