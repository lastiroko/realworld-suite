version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: dsar-postgres
    environment:
      POSTGRES_DB: dsar
      POSTGRES_USER: dsar
      POSTGRES_PASSWORD: dsar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U dsar -d dsar"]
      interval: 5s
      timeout: 3s
      retries: 20
